[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillrack-scraper"
version = "1.0.0"
description = "SkillRack incomplete question scraper with FastAPI bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
skillrack-scraper = "skillrack_scraper.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skillrack_scraper*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["skillrack_scraper/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "TRY003"]