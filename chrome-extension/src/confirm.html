<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>OpenAI OAuth</title>
		<style>
			:root {
				color-scheme: light;
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					sans-serif;
				background: #ffffff;
				color: #111111;
			}

			body {
				display: grid;
				margin: 0;
				min-height: 100vh;
				place-items: center;
			}

			main {
				text-align: center;
				width: min(430px, calc(100vw - 48px));
			}

			.brand {
				align-items: center;
				display: inline-flex;
				gap: 7px;
				margin-bottom: 28px;
			}

			.logo {
				display: block;
				height: 16px;
				transform: translateY(-1px);
				width: 16px;
			}

			.wordmark {
				display: block;
				height: 15px;
				width: auto;
			}

			h1 {
				font-size: clamp(25px, 3.1vw, 31px);
				font-weight: 540;
				letter-spacing: 0;
				line-height: 1.1;
				margin: 0;
			}

			p {
				color: #111111;
				font-size: 18px;
				line-height: 1.45;
				margin: 18px auto 0;
				max-width: 330px;
			}

			.actions {
				align-items: center;
				display: flex;
				gap: 12px;
				justify-content: center;
				margin-left: auto;
				margin-right: auto;
				margin-top: 38px;
				width: min(100%, 322px);
			}

			button {
				align-items: center;
				border-radius: 999px;
				cursor: pointer;
				display: inline-flex;
				flex: 1 1 0;
				font: inherit;
				font-size: 15px;
				font-weight: 500;
				justify-content: center;
				min-height: 50px;
				min-width: 0;
				padding: 13px 24px;
			}

			.primary {
				background: #111111;
				border: 1px solid #111111;
				color: #ffffff;
			}

			.secondary {
				background: #ffffff;
				border: 1px solid #d9d9d9;
				color: #111111;
			}

			.primary:hover {
				background: #2b2b2b;
				border-color: #2b2b2b;
			}

			.secondary:hover {
				background: #f9f9f9;
			}

			button:disabled {
				cursor: default;
				opacity: 0.5;
			}

			.error {
				color: #c33;
			}

			footer {
				align-items: center;
				bottom: 34px;
				color: #6f6f6f;
				display: flex;
				flex-direction: column;
				font-size: 12px;
				gap: 7px;
				left: 24px;
				line-height: 1.25;
				position: fixed;
				right: 24px;
				text-align: center;
			}

			footer a {
				color: inherit;
				text-decoration: none;
			}

			footer a:hover {
				color: #111111;
			}

			.footer-links {
				align-items: center;
				display: flex;
				gap: 8px;
				justify-content: center;
			}

			@media (max-width: 420px) {
				.actions {
					align-items: stretch;
					flex-direction: column;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<div class="brand" aria-label="OpenAI OAuth">
				<img alt="" class="logo" src="./assets/openai-oauth-logo.svg" />
				<img alt="OpenAI OAuth" class="wordmark" src="./assets/openai-oauth-wordmark.svg" />
			</div>
			<h1 id="title">Signed in to ChatGPT</h1>
			<p id="message">Continue to this app with ChatGPT.</p>
			<div class="actions">
				<button class="primary" id="continue" type="button" disabled>
					Continue
				</button>
				<button class="secondary" id="cancel" type="button" disabled>
					Cancel
				</button>
			</div>
		</main>
		<footer>
			<div style="display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: #4b5563; margin-bottom: 5px;">
				<svg height="15" width="15" viewBox="0 0 16 16" fill="currentColor" style="opacity: 0.8;"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.35 3.1 1.07.01.66.01 1.29.01 1.47 0 .21-.15.46-.55.38A8.013 8.013 0 0 1 0 8c0-4.42 3.58-8 8-8z"/></svg>
				<span>Reverse engineered by <a href="https://github.com/vishnu-tppr" target="_blank" style="font-weight: 600; text-decoration: underline; color: #111827;">@vishnu-tppr</a></span>
			</div>
			<div class="footer-links" style="font-size: 11.5px; opacity: 0.85;">
				<a href="https://github.com/evanzhoudev/openai-oauth" target="_blank">Learn more about OpenAI OAuth</a>
				<span aria-hidden="true">⋅</span>
				<a href="https://github.com/evanzhoudev/openai-oauth" target="_blank">GitHub</a>
				<span aria-hidden="true">⋅</span>
				<a href="https://github.com/evanzhoudev/openai-oauth#legal" target="_blank">Legal</a>
			</div>
		</footer>
		<script src="./confirm.js" type="module"></script>
	</body>
</html>
